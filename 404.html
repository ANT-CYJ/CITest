<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 本周热门电影</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf { display: grid; place-items: center; min-height: 70vh; text-align: center; padding: 0 24px; }
    .nf h1 { font-size: clamp(64px, 12vw, 128px); margin: 0; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf p { color: var(--text-1); margin: 8px 0 24px; }
    .nf a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #1a0c0a; font-weight: 600; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <h1>404</h1>
      <p>这部「电影」被剪辑师剪掉了。</p>
      <a href="./">回首页挑片</a>
    </div>
  </main>
</body>
</html>
