name: Refresh China box-office movies

on:
  # 每周一北京时间上午 9 点跑(UTC 01:00)
  schedule:
    - cron: '0 1 * * 1'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 推送到 main 时跑一次,方便改了前端/工作流后立刻刷新数据
  # paths-ignore 把 data/movies.json 排除,避免 Actions 自己 commit 后再触发自己
  push:
    branches:
      - main
    paths-ignore:
      - 'data/movies.json'
      - '**.md'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh data from TMDb (CN)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          export LANG="zh-CN"
          export REGION="CN"
          export BASE="https://api.themoviedb.org/3"
          node scripts/refresh.mjs data/movies.json
          echo "Wrote data/movies.json:"
          head -c 400 data/movies.json && echo "..."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/movies.json; then
            echo "No changes to data/movies.json."
          else
            git add data/movies.json
            git commit -m "chore(data): refresh China now-playing movies with details"
            git push
          fi
