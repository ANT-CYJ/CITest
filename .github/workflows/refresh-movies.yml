name: Refresh China box-office movies

on:
  # 每周一北京时间上午 9 点跑(UTC 01:00)
  schedule:
    - cron: '0 1 * * 1'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:
  # 推送到 main 时跑一次,方便改了前端/工作流后立刻刷新数据
  # paths-ignore 把 data/movies.json 排除,避免 Actions 自己 commit 后再触发自己
  push:
    branches:
      - main
    paths-ignore:
      - 'data/movies.json'
      - '**.md'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch now-playing + genres + per-movie details from TMDb (CN)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::TMDB_API_KEY secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          BASE="https://api.themoviedb.org/3"
          LANG="zh-CN"
          REGION="CN"

          echo "Fetching genre list..."
          GENRES_JSON=$(curl -fsSL "${BASE}/genre/movie/list?api_key=${TMDB_API_KEY}&language=${LANG}")

          echo "Fetching now-playing movies in China (page 1-2)..."
          NOW1=$(curl -fsSL "${BASE}/movie/now_playing?api_key=${TMDB_API_KEY}&language=${LANG}&region=${REGION}&page=1")
          NOW2=$(curl -fsSL "${BASE}/movie/now_playing?api_key=${TMDB_API_KEY}&language=${LANG}&region=${REGION}&page=2")

          # 合并两页 results
          node -e "
            const fs = require('fs');
            const a = JSON.parse(process.argv[1]);
            const b = JSON.parse(process.argv[2]);
            const seen = new Set();
            const merged = [];
            for (const m of [...(a.results||[]), ...(b.results||[])]) {
              if (!seen.has(m.id)) { seen.add(m.id); merged.push(m); }
            }
            process.stdout.write(JSON.stringify({ results: merged.slice(0, 40) }));
          " "$NOW1" "$NOW2" > now_playing.json
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('now_playing.json','utf8')).results.length)")
          echo "Got ${COUNT} movies."

          # 每部电影再并发拉详情 / 演职员 / 预告片,写到 details.json
          echo "Fetching per-movie details, credits, and videos..."
          node -e "
            const fs = require('fs');
            const key = process.env.TMDB_API_KEY;
            const lang = process.env.LANG;
            const base = process.env.BASE;
            const list = JSON.parse(fs.readFileSync('now_playing.json','utf8')).results;
            const top = list.slice(0, 12);
            const out = {};
            await Promise.all(top.map(async (m) => {
              const enc = encodeURIComponent;
              const urls = [
                base + '/movie/' + m.id + '?api_key=' + key + '&language=' + lang,
                base + '/movie/' + m.id + '/credits?api_key=' + key + '&language=' + lang,
                base + '/movie/' + m.id + '/videos?api_key=' + key + '&language=' + lang,
              ];
              try {
                const [det, cred, vid] = await Promise.all(urls.map(async (u) => {
                  const r = await fetch(u);
                  if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + u);
                  return r.json();
                }));
                out[m.id] = { details: det, credits: cred, videos: vid };
                console.log('  ✓', m.id, m.title);
              } catch (e) {
                console.error('  ✗', m.id, e.message);
                out[m.id] = { details: null, credits: null, videos: null, error: e.message };
              }
            }));
            fs.writeFileSync('details.json', JSON.stringify(out));
          "
          DCNT=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('details.json','utf8'))).length)")
          echo "Fetched details for ${DCNT} movies."

          NOW_JSON=$(cat now_playing.json)
          DETAILS_JSON=$(cat details.json)
          rm now_playing.json details.json

          mkdir -p data
          node scripts/build-movies-json.mjs \
            --genres "$GENRES_JSON" \
            --trending "$NOW_JSON" \
            --details "$DETAILS_JSON" \
            --out data/movies.json

          echo "Wrote data/movies.json:"
          head -c 800 data/movies.json && echo "..."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/movies.json; then
            echo "No changes to data/movies.json."
          else
            git add data/movies.json
            git commit -m "chore(data): refresh China now-playing movies with details"
            git push
          fi
